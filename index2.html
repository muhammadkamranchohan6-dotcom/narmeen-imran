<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narmeen Imran - Assignment</title>
<style>
body{
  margin:0;
  font-family: Arial;
  background: linear-gradient(lightpink, lightyellow, lightblue);
}
.header{
  display: flex;
  justify-content: space-between;
  background: white;
  padding: 12px;
}
.header .menu{
  display: flex;
  gap: 10px;
}
.menu a{
  text-decoration: none;
  color: black;
  background: #ffe6e6;
  padding: 5px 10px;
  border-radius: 5px;
  transition: 0.3s;
}
.menu a:hover{
  background: pink;
  transform: scale(1.1);
}
h1{
  text-align: center;
  animation: move 2s infinite;
}
@keyframes move{
  0%{transform: translateX(0px)}
  50%{transform: translateX(10px)}
  100%{transform: translateX(0px)}
}
.container{
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 15px;
  padding: 15px;
}
.item{
  background: white;
  padding: 8px;
  border-radius: 10px;
  text-align: center;
  transition: 0.4s;
}
.item:hover{
  transform: rotate(1deg) scale(1.05);
}
.item img{
  width: 100%;
  height: 140px;
  border-radius: 8px;
}
@media(max-width: 650px){
  .container{
    grid-template-columns: 1fr 1fr;
  }
  .header{
    flex-direction: column;
  }
}
@media(max-width: 400px){
  .container{
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<div class="header">
  <div><b>Narmeen Imran</b></div>
  <div class="menu">
    <a href="#home">Home</a>
    <a href="#pics">Gallery</a>
    <a href="#info">About</a>
  </div>
</div>

<h1 id="home">Welcome To My Website</h1>

<div class="container" id="pics">
  <div class="item"><img src="https://picsum.photos/300/200?1"><p>Grid - 1</p></div>
  <div class="item"><img src="https://picsum.photos/300/200?2"><p>Flexbox - 2</p></div>
  <div class="item"><img src="https://picsum.photos/300/200?3"><p>Animation - 3</p></div>
  <div class="item"><img src="https://picsum.photos/300/200?4"><p>Transition - 4</p></div>
  <div class="item"><img src="https://picsum.photos/300/200?5"><p>Transform - 5</p></div>
  <div class="item"><img src="https://picsum.photos/300/200?6"><p>Gradient - 6</p></div>
</div>

<div id="info" style="background:white; margin:10px; padding:15px; border-radius:10px;">
  <h3>About My Project</h3>
  <p>I have used Grids, Flexbox, Page Links, Animation, Transition, Transform, Media Queries and Linear Gradient in this website. - Narmeen Imran</p>
</div>

</body>
</html>
